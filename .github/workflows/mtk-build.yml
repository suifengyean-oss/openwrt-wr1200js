name: Build OpenWrt for WR1200JS (MTK Closed WiFi + Argon + Wizard)

on:
  workflow_dispatch:
    inputs:
      openwrt_branch:
        description: 'OpenWrt branch'
        required: false
        default: 'openwrt-24.10'
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  OPENWRT_BRANCH: 'openwrt-24.10'
  TARGET: 'ramips'
  SUBTARGET: 'mt7621'
  PROFILE: 'youhua_wr1200js'
  DEVICE_NAME: 'WR1200JS'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc wget unzip python3 \
            python3-distutils zstd squashfs-tools upx-ucl || sudo apt-get install -y upx

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.openwrt_branch }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ env.OPENWRT_BRANCH }}" >> $GITHUB_OUTPUT
          fi

      - name: Clone OpenWrt source
        run: |
          echo "=== 克隆 OpenWrt 官方源码 ==="
          git clone --depth 1 -b "${{ steps.version.outputs.version }}" \
            https://git.openwrt.org/openwrt/openwrt.git openwrt
          cd openwrt
          echo "源码分支: $(git branch --show-current)"

      - name: Add MTK feed and apply patches
        run: |
          cd openwrt

          echo "=== 添加 MTK 官方 Feed (GitHub 镜像) ==="
          echo "src-git mtk_openwrt_feed https://github.com/GainStrongService/mtk-openwrt-feeds.git" \
            >> feeds.conf.default
          cat feeds.conf.default

          echo "=== 更新所有 feeds ==="
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          echo "=== 检查 MTK feed 是否克隆成功 ==="
          if [ ! -d "./feeds/mtk_openwrt_feed" ]; then
            echo "❌ MTK feed 克隆失败，退出"
            exit 1
          fi
          echo "✅ MTK feed 已就绪"

          echo "=== 应用 MTK 24.10 补丁和文件 ==="
          cp -af ./feeds/mtk_openwrt_feed/24.10/files/* . 2>/dev/null || true

          for file in $(find ./feeds/mtk_openwrt_feed/24.10/patches-base -name "*.patch" | sort); do
            echo "Applying base patch: $file"
            patch -f -p1 -i ${file} || true
          done

          if [ -d "./feeds/mtk_openwrt_feed/24.10/patches-feeds" ]; then
            for file in $(find ./feeds/mtk_openwrt_feed/24.10/patches-feeds -name "*.patch" | sort); do
              echo "Applying feed patch: $file"
              patch -f -p1 -i ${file} || true
            done
          fi

      - name: Prepare custom files (UCI defaults, IRQ balance, sysctl, Argon, Wizard, kiddin9 feed)
        run: |
          echo "=== 创建自定义文件目录 ==="
          mkdir -p openwrt/files/etc/uci-defaults
          mkdir -p openwrt/files/etc/init.d
          mkdir -p openwrt/files/etc/sysctl.d
          mkdir -p openwrt/files/etc/opkg

          # ========== 1. UCI 默认配置 ==========
          cat > openwrt/files/etc/uci-defaults/90-wr1200js-setup << 'UCI_EOF'
          #!/bin/sh
          # WR1200JS 首次开机快速配置

          # LAN IP
          uci set network.lan.ipaddr='192.168.2.1'
          uci set network.lan.netmask='255.255.255.0'
          uci set network.lan.dns='8.8.8.8'
          uci set network.lan.dns='8.8.4.4'

          # WiFi 双频分开
          uci set wireless.radio0.disabled='0'
          uci set wireless.radio1.disabled='0'
          uci delete wireless.radio0.multi_ap 2>/dev/null
          uci delete wireless.radio1.multi_ap 2>/dev/null
          uci set wireless.default_radio0.mode='ap'
          uci set wireless.default_radio0.ssid='OPENWRT'
          uci set wireless.default_radio0.encryption='none'
          uci set wireless.default_radio0.network='lan'
          uci set wireless.default_radio1.mode='ap'
          uci set wireless.default_radio1.ssid='OPENWRT-5G'
          uci set wireless.default_radio1.encryption='none'
          uci set wireless.default_radio1.network='lan'

          # 时区
          uci set system.@system[0].timezone='CST-8'
          uci set system.@system[0].zonename='Asia/Shanghai'
          uci set system.@system[0].hostname='WR1200JS'

          # DHCP
          uci delete dhcp.lan 2>/dev/null
          uci set dhcp.lan=dhcp
          uci set dhcp.lan.interface='lan'
          uci set dhcp.lan.start='100'
          uci set dhcp.lan.limit='150'
          uci set dhcp.lan.leasetime='12h'

          # Wizard 向导配置
          uci set wizard.default=wizard
          uci set wizard.default.landing_page='wizard'

          # Argon 主题设为默认
          uci set luci.main.mediaurlbase='/luci-static/argon'

          # SmartDNS 配置
          uci set smartdns.@smartdns[0].enabled='1'
          uci set smartdns.@smartdns[0].port='6053'
          uci set smartdns.@smartdns[0].tcp_server='1'
          uci set smartdns.@smartdns[0].ipv6_server='0'
          uci set smartdns.@smartdns[0].dualstack_ip_selection='1'
          uci set smartdns.@smartdns[0].serve_expired='1'
          uci set smartdns.@smartdns[0].cache_size='32768'
          uci set smartdns.@smartdns[0].rr_ttl_min='300'
          uci -q delete smartdns.@smartdns[0].server
          uci add_list smartdns.@smartdns[0].server='223.5.5.5'
          uci add_list smartdns.@smartdns[0].server='119.29.29.29'
          uci add_list smartdns.@smartdns[0].server='180.184.1.1'
          uci add_list smartdns.@smartdns[0].server='1.1.1.1'
          uci commit smartdns

          # dnsmasq 转发 DNS 到 SmartDNS
          uci set dhcp.@dnsmasq[0].server='127.0.0.1#6053'
          uci set dhcp.@dnsmasq[0].noresolv='1'
          uci set dhcp.@dnsmasq[0].cachesize='0'
          uci commit dhcp

          # 硬件 NAT 卸载
          uci set firewall.@defaults[0].flow_offloading='1'
          uci set firewall.@defaults[0].flow_offloading_hw='1'
          uci commit firewall

          # CPU 调度器 performance
          for cpu in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
            [ -e "$cpu" ] && echo performance > "$cpu"
          done

          # 启用 irq-balance 服务
          /etc/init.d/irq-balance enable

          # 提交
          uci commit network
          uci commit wireless
          uci commit system
          uci commit wizard
          uci commit luci
          exit 0
          UCI_EOF
          chmod +x openwrt/files/etc/uci-defaults/90-wr1200js-setup
          echo "✅ UCI 默认配置已创建"

          # ========== 2. IRQ 均衡脚本 ==========
          cat > openwrt/files/etc/init.d/irq-balance << 'IRQ_EOF'
          #!/bin/sh /etc/rc.common
          START=99
          start() {
              sleep 5
              CPU1_MASK="2"
              CPU2_MASK="4"
              CPU3_MASK="8"
              if [ -d "/sys/class/net/eth0/queues/rx-0" ]; then
                  echo "$CPU3_MASK" > /sys/class/net/eth0/queues/rx-0/rps_cpus 2>/dev/null
              fi
              for iface in wan pppoe-wan; do
                  if [ -d "/sys/class/net/$iface/queues/rx-0" ]; then
                      echo "$CPU2_MASK" > /sys/class/net/$iface/queues/rx-0/rps_cpus 2>/dev/null
                  fi
              done
              for iface in lan1 lan2 lan3 lan4; do
                  if [ -d "/sys/class/net/$iface/queues/rx-0" ]; then
                      echo "$CPU1_MASK" > /sys/class/net/$iface/queues/rx-0/rps_cpus 2>/dev/null
                  fi
              done
              for irq_dir in /proc/irq/*; do
                  if [ -f "$irq_dir/smp_affinity" ]; then
                      irq_name=$(grep -m 1 -o 'mt76[^ ]*' "$irq_dir/../interrupts" 2>/dev/null | head -1)
                      if [ -n "$irq_name" ]; then
                          echo "$CPU3_MASK" > "$irq_dir/smp_affinity" 2>/dev/null
                      fi
                  fi
              done
              for iface in eth0 wan lan1 lan2 lan3 lan4; do
                  ethtool --set-eee $iface eee off 2>/dev/null
              done
              echo 1 > /proc/sys/net/core/backlog_threaded 2>/dev/null
          }
          IRQ_EOF
          chmod +x openwrt/files/etc/init.d/irq-balance
          echo "✅ IRQ 均衡脚本已创建"

          # ========== 3. sysctl 优化 ==========
          cat > openwrt/files/etc/sysctl.d/10-custom.conf << 'SYSCTL_EOF'
          vm.vfs_cache_pressure = 200
          vm.min_free_kbytes = 4096
          vm.swappiness = 10
          net.ipv4.tcp_congestion_control = bbr
          net.ipv4.tcp_fastopen = 3
          net.core.netdev_max_backlog = 16384
          net.netfilter.nf_conntrack_max = 65536
          net.ipv4.tcp_ecn = 1
          net.ipv4.tcp_slow_start_after_idle = 0
          net.core.somaxconn = 65536
          SYSCTL_EOF
          echo "✅ sysctl 优化配置已创建"

          # ========== 4. 集成 Argon 主题 ==========
          echo "=== 下载 luci-theme-argon ==="
          ARGON_FILENAME="luci-theme-argon_2.4.3-r17_all.ipk"
          DOWNLOAD_OK=0
          for URL in \
            "https://dl.openwrt.ai/releases/24.10/packages/mipsel_24kc/kiddin9/${ARGON_FILENAME}" \
            "https://dl.openwrt.ai/latest/packages/mipsel_24kc/kiddin9/${ARGON_FILENAME}" \
            "https://dl.openwrt.ai/releases/25.12/packages/mipsel_24kc/kiddin9/${ARGON_FILENAME}"; do
            echo "Trying: $URL"
            curl -L --retry 2 --retry-delay 3 --connect-timeout 20 \
              -o /tmp/luci-theme-argon.ipk "$URL" 2>/dev/null
            SIZE=$(stat -c%s /tmp/luci-theme-argon.ipk 2>/dev/null || echo 0)
            FILE_TYPE=$(file /tmp/luci-theme-argon.ipk 2>/dev/null | head -1)
            if [ "$SIZE" -gt 1000 ] && echo "$FILE_TYPE" | grep -qiE 'gzip|tar|ar|archive'; then
              echo "✅ Argon 下载成功 (${SIZE} bytes)"
              DOWNLOAD_OK=1
              break
            else
              echo "   Failed (${SIZE} bytes, type: ${FILE_TYPE})"
            fi
          done

          if [ "$DOWNLOAD_OK" = "1" ]; then
            mkdir -p /tmp/argon-extract
            cd /tmp/argon-extract
            rm -f debian-binary control.tar.gz control.tar.xz data.tar.gz data.tar.xz
            if file /tmp/luci-theme-argon.ipk | grep -q gzip; then
              mv /tmp/luci-theme-argon.ipk /tmp/luci-theme-argon.ipk.gz
              gzip -d /tmp/luci-theme-argon.ipk.gz
            fi
            ar x /tmp/luci-theme-argon.ipk 2>/dev/null || tar xf /tmp/luci-theme-argon.ipk 2>/dev/null
            if [ -f data.tar.xz ]; then
              tar -xJf data.tar.xz -C openwrt/files 2>/dev/null
            elif [ -f data.tar.gz ]; then
              tar -xzf data.tar.gz -C openwrt/files 2>/dev/null
            fi
            echo "✅ Argon 主题已集成到 files"
            find openwrt/files -path '*argon*' -type f | head -10
          else
            echo "⚠ Argon 主题下载失败，跳过"
          fi

          # ========== 5. 集成 luci-app-wizard ==========
          echo "=== 下载 luci-app-wizard ==="
          WIZARD_FILENAME="luci-app-wizard_26.279.56137~d1f4de8_all.ipk"
          WIZARD_OK=0
          for URL in \
            "https://dl.openwrt.ai/releases/24.10/packages/mipsel_24kc/kiddin9/${WIZARD_FILENAME}" \
            "https://dl.openwrt.ai/latest/packages/mipsel_24kc/kiddin9/${WIZARD_FILENAME}" \
            "https://dl.openwrt.ai/releases/25.12/packages/mipsel_24kc/kiddin9/${WIZARD_FILENAME}"; do
            echo "Trying: $URL"
            curl -L --retry 2 --retry-delay 3 --connect-timeout 20 \
              -o /tmp/luci-app-wizard.ipk "$URL" 2>/dev/null
            SIZE=$(stat -c%s /tmp/luci-app-wizard.ipk 2>/dev/null || echo 0)
            FILE_TYPE=$(file /tmp/luci-app-wizard.ipk 2>/dev/null | head -1)
            if [ "$SIZE" -gt 1000 ] && echo "$FILE_TYPE" | grep -qiE 'gzip|tar|ar|archive'; then
              echo "✅ Wizard 下载成功 (${SIZE} bytes)"
              WIZARD_OK=1
              break
            else
              echo "   Failed (${SIZE} bytes, type: ${FILE_TYPE})"
            fi
          done

          if [ "$WIZARD_OK" = "1" ]; then
            mkdir -p /tmp/wizard-extract
            cd /tmp/wizard-extract
            rm -f debian-binary control.tar.gz control.tar.xz data.tar.gz data.tar.xz
            if file /tmp/luci-app-wizard.ipk | grep -q gzip; then
              mv /tmp/luci-app-wizard.ipk /tmp/luci-app-wizard.ipk.gz
              gzip -d /tmp/luci-app-wizard.ipk.gz
            fi
            ar x /tmp/luci-app-wizard.ipk 2>/dev/null || tar xf /tmp/luci-app-wizard.ipk 2>/dev/null
            if [ -f data.tar.xz ]; then
              tar -xJf data.tar.xz -C openwrt/files 2>/dev/null
            elif [ -f data.tar.gz ]; then
              tar -xzf data.tar.gz -C openwrt/files 2>/dev/null
            fi
            echo "✅ Wizard 已集成到 files"
            find openwrt/files -path '*wizard*' -type f | head -10
          else
            echo "⚠ Wizard 下载失败，跳过"
          fi

          # ========== 6. 添加 kiddin9 第三方软件源 ==========
          echo "=== 添加 kiddin9 软件源 (24.10) ==="
          cat > openwrt/files/etc/opkg/customfeeds.conf << 'FEED_EOF'
          src/gz kiddin9_packages https://dl.openwrt.ai/releases/24.10/packages/mipsel_24kc/kiddin9
          src/gz kiddin9_base https://dl.openwrt.ai/releases/24.10/targets/ramips/mt7621/packages
          FEED_EOF
          echo "✅ kiddin9 软件源已添加"

          echo "=== files 目录结构 ==="
          find openwrt/files -type d | sort

      - name: Configure build with MTK closed-source WiFi
        run: |
          cd openwrt
          echo "=== 生成默认配置 ==="
          make defconfig

          echo "=== 应用 MTK 和自定义配置 ==="

          # 目标平台
          echo "CONFIG_TARGET_ramips=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_DEVICE_youhua_wr1200js=y" >> .config

          # MTK 闭源无线驱动：禁用开源 mt76，启用闭源
          echo "# CONFIG_PACKAGE_kmod-mt7603 is not set" >> .config
          echo "# CONFIG_PACKAGE_kmod-mt76x2 is not set" >> .config
          echo "# CONFIG_PACKAGE_kmod-mt76 is not set" >> .config
          echo "CONFIG_PACKAGE_kmod-mt_wifi=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mt_ppe=y" >> .config

          # 无线工具
          echo "CONFIG_PACKAGE_wpad-openssl=y" >> .config
          echo "# CONFIG_PACKAGE_wpad-basic-mbedtls is not set" >> .config
          echo "CONFIG_PACKAGE_wireless-regdb=y" >> .config
          echo "CONFIG_PACKAGE_iwinfo=y" >> .config

          # LuCI 和基础软件
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-compat=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-firewall=y" >> .config
          echo "CONFIG_PACKAGE_dnsmasq=y" >> .config

          # SmartDNS
          echo "CONFIG_PACKAGE_smartdns=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-smartdns=y" >> .config

          # UPnP
          echo "CONFIG_PACKAGE_luci-app-upnp=y" >> .config
          echo "CONFIG_PACKAGE_miniupnpd-nftables=y" >> .config

          # 工具
          echo "CONFIG_PACKAGE_nano=y" >> .config
          echo "CONFIG_PACKAGE_wget=y" >> .config
          echo "CONFIG_PACKAGE_ethtool=y" >> .config

          # 内存优化
          echo "CONFIG_PACKAGE_zram-swap=y" >> .config
          echo "CONFIG_PACKAGE_kmod-lib-lzo=y" >> .config

          # 网络辅助
          echo "CONFIG_PACKAGE_kmod-nf-nathelper=y" >> .config
          echo "CONFIG_PACKAGE_kmod-nf-flow=y" >> .config

          # 禁用 PPPoE
          echo "# CONFIG_PACKAGE_ppp is not set" >> .config
          echo "# CONFIG_PACKAGE_ppp-mod-pppoe is not set" >> .config

          # 禁用 IPv6 辅助
          echo "# CONFIG_PACKAGE_odhcpd-ipv6only is not set" >> .config
          echo "# CONFIG_PACKAGE_odhcp6c is not set" >> .config

          echo "=== 最终配置检查 ==="
          grep -E 'CONFIG_TARGET_ramips|CONFIG_PACKAGE_kmod-mt|CONFIG_PACKAGE_kmod-mt_wifi' .config

      - name: Build firmware
        run: |
          cd openwrt
          echo "=== 开始编译 (使用 $(nproc) 线程) ==="
          make -j$(nproc) V=s 2>&1 | tee build.log
          echo "=== 编译完成 ==="
          find bin/ -name "*.bin" -o -name "*.trx" 2>/dev/null | head -20

      - name: Collect firmware output
        run: |
          mkdir -p output
          find openwrt/bin/ -name "*squashfs-sysupgrade.bin" -exec cp {} output/ \; 2>/dev/null
          find openwrt/bin/ -name "*factory.bin" -exec cp {} output/ \; 2>/dev/null
          find openwrt/bin/ -name "*initramfs-kernel.bin" -exec cp {} output/ \; 2>/dev/null
          echo "=== 固件文件 ==="
          ls -lh output/ 2>/dev/null || echo "⚠ 未找到固件文件，请检查编译日志"

      - name: UPX compress large binaries
        run: |
          echo "=== UPX 压缩 (仅针对 .elf 可执行文件) ==="
          if command -v upx &> /dev/null; then
            find output/ -type f -name "*.elf" | while read -r file; do
              SIZE=$(stat -c%s "$file" 2>/dev/null || echo 0)
              if [ "$SIZE" -gt 204800 ]; then
                echo "尝试压缩: $file ($((SIZE / 1024)) KB)"
                upx --lzma --best "$file" 2>/dev/null && echo "  ✅ 完成" || echo "  ⚠ 跳过"
              fi
            done
          else
            echo "⚠ UPX 未安装，跳过"
          fi

      - name: Check firmware size
        run: |
          echo "=== 固件文件 ==="
          ls -lh output/ 2>/dev/null || echo "输出目录为空"
          echo ""
          echo "=== 空间检查 ==="
          FIRMWARE_SIZE=$(stat -c%s output/*sysupgrade*.bin 2>/dev/null || echo 0)
          MAX_SIZE=$((15 * 1024 * 1024))
          echo "固件大小: $((FIRMWARE_SIZE / 1024 / 1024)) MB ($FIRMWARE_SIZE bytes)"
          echo "最大限制: $((MAX_SIZE / 1024 / 1024)) MB ($MAX_SIZE bytes)"
          if [ "$FIRMWARE_SIZE" -eq 0 ]; then
            echo "⚠ 未找到 sysupgrade 固件，可能编译失败"
          elif [ "$FIRMWARE_SIZE" -gt "$MAX_SIZE" ]; then
            echo "❌ 固件超出 flash 空间限制!"
            exit 1
          else
            echo "✅ 固件大小合适"
          fi

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-mtk-wifi-${{ env.DEVICE_NAME }}-${{ steps.version.outputs.version }}
          path: output/*
          retention-days: 30

      - name: Generate checksums
        run: |
          cd output
          sha256sum * > sha256sums.txt 2>/dev/null || echo "无文件可生成校验和"
          echo "=== SHA256 校验和 ==="
          cat sha256sums.txt 2>/dev/null || true

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: "OpenWrt MTK WiFi ${{ steps.version.outputs.version }} for ${{ env.DEVICE_NAME }}"
          body: |
            ## OpenWrt MTK Closed-Source WiFi ${{ steps.version.outputs.version }} for YouHua WR1200JS

            ### 设备信息
            - **型号**: YouHua WR1200JS
            - **SoC**: MediaTek MT7621AT (MIPS 1004Kc, 4核 880MHz)
            - **RAM**: 128MB
            - **Flash**: 16MB SPI NOR
            - **WiFi**: MT7603E (2.4G) + MT76x2E (5G)
            - **Target**: ramips/mt7621 (mipsel_24kc)

            ### 更新日志
            #### 基于 OpenWrt ${{ steps.version.outputs.version }} 官方源码 + MTK 闭源 WiFi 驱动
            - **MTK 闭源无线驱动**：替换开源 mt76 驱动，提升无线性能和稳定性
            - **集成 Argon 主题和 Wizard 配置向导**
            - **添加 kiddin9 第三方软件源**，方便后续安装插件
            - **智能 IRQ/RPS 中断均衡**：自动检测网卡与中断
            - **自动禁用 EEE**：解决 MT7621 平台网络稳定性问题
            - **线程化 NAPI**：提升高负载下网络转发性能
            - **ZRAM 内存压缩**：缓解 128MB 内存压力
            - **sysctl 网络优化**：BBR、连接跟踪、队列长度等
            - **SmartDNS + dnsmasq 协同**：SmartDNS 监听 6053，dnsmasq 转发
            - **保留 LuCI、UPnP、nano、wget、ethtool**

            ### 固件说明
            基于 OpenWrt 官方源码编译，集成 MTK 官方 feed 提供的闭源无线驱动。
            **本固件不含 PPPoE 拨号功能，适用于二级路由 (DHCP 上网) 场景。**

            ### 安装方法
            1. 下载最新 Release 中的 `squashfs-sysupgrade.bin` 文件
            2. 刷入 Breed 后断电，按住 WiFi 按钮插电，访问 `192.168.1.1` 进入 Breed
            3. 恢复出厂后刷入之前下载的 bin 文件

            ### 预装软件
            | 分类 | 软件 |
            |------|------|
            | Web 管理 | LuCI + 中文 + Argon 主题 + Wizard |
            | WiFi | MTK 闭源驱动 (MT7603 + MT76x2) |
            | 网络 | 静态地址 / DHCP |
            | DNS | SmartDNS (监听 6053) + dnsmasq 转发 |
            | UPnP | miniupnpd-nftables |
            | 工具 | nano, wget, ethtool |
            | 内存优化 | ZRAM 压缩 |
