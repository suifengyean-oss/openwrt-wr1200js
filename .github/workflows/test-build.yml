name: Build OpenWrt for WR1200JS (Source Build)

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt version'
        required: false
        default: '25.12.5'
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  OPENWRT_VERSION: '25.12.5'
  TARGET: 'ramips'
  SUBTARGET: 'mt7621'
  PROFILE: 'youhua_wr1200js'
  DEVICE_NAME: 'WR1200JS'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 1. 安装源码编译依赖
      # ============================================================
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync swig unzip zlib1g-dev \
            file wget subversion quilt mercurial libxml-parser-perl \
            xsltproc zstd squashfs-tools upx-ucl || \
          sudo apt-get install -y upx

      # ============================================================
      # 2. 设置版本号
      # ============================================================
      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.openwrt_version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ env.OPENWRT_VERSION }}" >> $GITHUB_OUTPUT
          fi

      # ============================================================
      # 3. 克隆 OpenWrt 源码
      # ============================================================
      - name: Clone OpenWrt source
        run: |
          VERSION=${{ steps.version.outputs.version }}
          echo "Cloning OpenWrt ${VERSION} source..."
          git clone --depth 1 https://github.com/openwrt/openwrt.git -b openwrt-${VERSION} openwrt-src
          cd openwrt-src
          echo "Source ready: $(pwd)"
          ls -la

      # ============================================================
      # 4. 配置 feeds 并集成 AdGuard Home（Method 1: Via feeds configuration）
      # ============================================================
      - name: Configure feeds (including AdGuard Home)
        run: |
          cd openwrt-src

          # 4.1 添加 AdGuard Home 插件源到 feeds.conf.default 最上方
          sed -i '1i src-git adguardhome https://github.com/MomoFlora/luci-app-adguardhome.git;main' feeds.conf.default

          # 4.2 添加 kiddin9 软件源（保留原有设置）
          echo 'src-git kiddin9 https://dl.openwrt.ai/releases/25.12/packages/mipsel_24kc/kiddin9' >> feeds.conf.default
          echo 'src-git kiddin9_target https://dl.openwrt.ai/releases/25.12/targets/ramips/mt7621/packages' >> feeds.conf.default

          # 4.3 更新并安装所有 feeds
          echo "=== feeds.conf.default ==="
          cat feeds.conf.default
          echo ""
          echo "=== 开始更新 feeds ==="
          ./scripts/feeds update -a
          echo ""
          echo "=== 开始安装 feeds ==="
          ./scripts/feeds install -a

          echo ""
          echo "=== AdGuard Home feed 验证 ==="
          ls -la feeds/adguardhome/ 2>/dev/null || echo "⚠ adguardhome feed 目录不存在"
          echo ""
          echo "=== luci-app-adguardhome 安装验证 ==="
          ls -la package/feeds/adguardhome/luci-app-adguardhome/ 2>/dev/null || \
            ls -la feeds/adguardhome/luci-app-adguardhome/ 2>/dev/null || \
            echo "⚠ luci-app-adguardhome 未找到"

      # ============================================================
      # 5. 创建 UCI defaults 和系统优化
      # ============================================================
      - name: Create UCI defaults and system optimizations
        run: |
          echo "=== 创建 UCI defaults 快速配置 ==="
          mkdir -p openwrt-src/files/etc/uci-defaults

          cat > openwrt-src/files/etc/uci-defaults/90-wr1200js-setup << 'UCI_EOF'
          #!/bin/sh
          # WR1200JS 首次开机快速配置

          # 1. LAN IP
          uci set network.lan.ipaddr='192.168.2.1'
          uci set network.lan.netmask='255.255.255.0'
          uci -q delete network.lan.dns
          uci add_list network.lan.dns='8.8.8.8'
          uci add_list network.lan.dns='8.8.4.4'

          # 2. WiFi 双频分开
          uci set wireless.radio0.disabled='0'
          uci set wireless.radio1.disabled='0'
          uci -q delete wireless.radio0.multi_ap
          uci -q delete wireless.radio1.multi_ap
          uci set wireless.default_radio0.mode='ap'
          uci set wireless.default_radio0.ssid='OPENWRT'
          uci set wireless.default_radio0.encryption='none'
          uci set wireless.default_radio0.network='lan'
          uci set wireless.default_radio1.mode='ap'
          uci set wireless.default_radio1.ssid='OPENWRT-5G'
          uci set wireless.default_radio1.encryption='none'
          uci set wireless.default_radio1.network='lan'

          # 3. 时区
          uci set system.@system[0].timezone='CST-8'
          uci set system.@system[0].zonename='Asia/Shanghai'
          uci set system.@system[0].hostname='WR1200JS'

          # 4. DHCP
          uci -q delete dhcp.lan
          uci set dhcp.lan=dhcp
          uci set dhcp.lan.interface='lan'
          uci set dhcp.lan.start='100'
          uci set dhcp.lan.limit='150'
          uci set dhcp.lan.leasetime='12h'

          # 5. Wizard 向导配置
          uci set wizard.default=wizard
          uci set wizard.default.landing_page='wizard'

          # 6. SmartDNS 配置 (监听 6053，避免与 dnsmasq 冲突)
          uci set smartdns.@smartdns[0].enabled='1'
          uci set smartdns.@smartdns[0].port='6053'
          uci set smartdns.@smartdns[0].tcp_server='1'
          uci set smartdns.@smartdns[0].ipv6_server='0'
          uci set smartdns.@smartdns[0].dualstack_ip_selection='1'
          uci set smartdns.@smartdns[0].serve_expired='1'
          uci set smartdns.@smartdns[0].cache_size='32768'
          uci set smartdns.@smartdns[0].rr_ttl_min='300'
          uci -q delete smartdns.@smartdns[0].server
          uci add_list smartdns.@smartdns[0].server='223.5.5.5'
          uci add_list smartdns.@smartdns[0].server='119.29.29.29'
          uci add_list smartdns.@smartdns[0].server='180.184.1.1'
          uci add_list smartdns.@smartdns[0].server='1.1.1.1'
          uci commit smartdns

          # 7. dnsmasq 转发 DNS 到 SmartDNS (127.0.0.1:6053)
          uci set dhcp.@dnsmasq[0].server='127.0.0.1#6053'
          uci set dhcp.@dnsmasq[0].noresolv='1'
          uci set dhcp.@dnsmasq[0].cachesize='0'
          uci commit dhcp

          # 8. 启用硬件 NAT 卸载 (flow offloading)
          uci set firewall.@defaults[0].flow_offloading='1'
          uci set firewall.@defaults[0].flow_offloading_hw='1'
          uci commit firewall

          # 9. 系统优化：CPU 调度器设为 performance
          for cpu in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
            [ -e "$cpu" ] && echo performance > "$cpu"
          done

          # 10. 启用 irq-balance 服务
          /etc/init.d/irq-balance enable

          # 11. 提交
          uci commit network
          uci commit wireless
          uci commit system
          uci commit wizard
          exit 0
          UCI_EOF

          chmod +x openwrt-src/files/etc/uci-defaults/90-wr1200js-setup
          echo "✅ 快速配置脚本已创建"

          # === 创建 IRQ 自动均衡脚本 ===
          echo "=== 创建 IRQ 自动均衡脚本 ==="
          mkdir -p openwrt-src/files/etc/init.d
          cat > openwrt-src/files/etc/init.d/irq-balance << 'IRQ_EOF'
          #!/bin/sh /etc/rc.common
          START=99
          start() {
              sleep 5
              CPU1_MASK="2"
              CPU2_MASK="4"
              CPU3_MASK="8"

              # eth0 -> CPU3
              if [ -d "/sys/class/net/eth0/queues/rx-0" ]; then
                  echo "$CPU3_MASK" > /sys/class/net/eth0/queues/rx-0/rps_cpus 2>/dev/null
              fi

              # WAN -> CPU2
              for iface in wan pppoe-wan; do
                  if [ -d "/sys/class/net/$iface/queues/rx-0" ]; then
                      echo "$CPU2_MASK" > /sys/class/net/$iface/queues/rx-0/rps_cpus 2>/dev/null
                  fi
              done

              # LAN -> CPU1
              for iface in lan1 lan2 lan3 lan4; do
                  if [ -d "/sys/class/net/$iface/queues/rx-0" ]; then
                      echo "$CPU1_MASK" > /sys/class/net/$iface/queues/rx-0/rps_cpus 2>/dev/null
                  fi
              done

              # 无线中断 -> CPU3
              for irq_dir in /proc/irq/*; do
                  if [ -f "$irq_dir/smp_affinity" ]; then
                      irq_name=$(grep -m 1 -o 'mt76[^ ]*' "$irq_dir/../interrupts" 2>/dev/null | head -1)
                      if [ -n "$irq_name" ]; then
                          echo "$CPU3_MASK" > "$irq_dir/smp_affinity" 2>/dev/null
                      fi
                  fi
              done

              # 禁用 EEE
              for iface in eth0 wan lan1 lan2 lan3 lan4; do
                  ethtool --set-eee $iface eee off 2>/dev/null
              done

              # 启用线程化 NAPI
              echo 1 > /proc/sys/net/core/backlog_threaded 2>/dev/null
          }
          IRQ_EOF

          chmod +x openwrt-src/files/etc/init.d/irq-balance
          echo "✅ IRQ 自动均衡脚本已创建"

          # === 创建 sysctl 优化配置 ===
          echo "=== 创建 sysctl 优化配置 ==="
          mkdir -p openwrt-src/files/etc/sysctl.d
          cat > openwrt-src/files/etc/sysctl.d/10-custom.conf << 'SYSCTL_EOF'
          # WR1200JS 内存与网络优化
          vm.vfs_cache_pressure = 200
          vm.min_free_kbytes = 4096
          vm.swappiness = 10
          net.ipv4.tcp_congestion_control = bbr
          net.ipv4.tcp_fastopen = 3
          net.core.netdev_max_backlog = 16384
          net.netfilter.nf_conntrack_max = 65536
          net.ipv4.tcp_ecn = 1
          net.ipv4.tcp_slow_start_after_idle = 0
          net.core.somaxconn = 65536
          SYSCTL_EOF
          echo "✅ sysctl 优化配置已创建"

          # === 添加 kiddin9 软件源 (后续插件安装) ===
          echo "=== 添加 kiddin9 软件源 ==="
          mkdir -p openwrt-src/files/etc/opkg
          cat > openwrt-src/files/etc/opkg/customfeeds.conf << 'FEED_EOF'
          src/gz kiddin9_packages https://dl.openwrt.ai/releases/25.12/packages/mipsel_24kc/kiddin9
          src/gz kiddin9_base https://dl.openwrt.ai/releases/25.12/targets/ramips/mt7621/packages
          FEED_EOF
          echo "✅ kiddin9 软件源已添加"

          echo ""
          echo "FILES directory ready:"
          find openwrt-src/files -type d | sort

      # ============================================================
      # 6. 生成 .config 配置文件
      # ============================================================
      - name: Generate .config
        run: |
          cd openwrt-src

          # 6.1 下载官方目标配置作为基础
          VERSION=${{ steps.version.outputs.version }}
          CONFIG_URL="https://downloads.openwrt.org/releases/${VERSION}/targets/${TARGET}/${SUBTARGET}/config.buildinfo"
          echo "Downloading base config: ${CONFIG_URL}"
          curl -L --retry 5 --retry-delay 15 --connect-timeout 30 -o .config "$CONFIG_URL" || \
            echo "⚠ 基础配置下载失败，将使用最小配置"

          # 6.2 确保文件存在
          touch .config

          # 6.3 设置目标设备
          cat >> .config << 'CONFIG_EOF'

          # ===== WR1200JS 设备配置 =====
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_youhua_wr1200js=y
          CONFIG_TARGET_PROFILE="youhua_wr1200js"
          CONFIG_EOF

          # 6.4 添加需要的软件包
          cat >> .config << 'PKG_EOF'

          # ===== 基础系统 =====
          CONFIG_PACKAGE_dnsmasq=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_dropbear=y

          # ===== LuCI 界面 =====
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-lib-jsonc=y
          CONFIG_PACKAGE_lua=y

          # ===== 无线驱动 =====
          CONFIG_PACKAGE_kmod-mt7603=y
          CONFIG_PACKAGE_kmod-mt76x2=y
          CONFIG_PACKAGE_kmod-mt76=y
          CONFIG_PACKAGE_kmod-mt76-core=y
          CONFIG_PACKAGE_wpad-openssl=y
          CONFIG_PACKAGE_wireless-regdb=y
          CONFIG_PACKAGE_iwinfo=y

          # ===== SmartDNS =====
          CONFIG_PACKAGE_smartdns=y
          CONFIG_PACKAGE_luci-app-smartdns=y

          # ===== AdGuard Home (通过 feeds 集成) =====
          CONFIG_PACKAGE_luci-app-adguardhome=y
          CONFIG_PACKAGE_adguardhome=y
          CONFIG_PACKAGE_luci-lua-runtime=y

          # ===== UPnP =====
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_miniupnpd-nftables=y

          # ===== 工具 =====
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_wget=y
          CONFIG_PACKAGE_ethtool=y

          # ===== 内存优化 =====
          CONFIG_PACKAGE_zram-swap=y
          CONFIG_PACKAGE_kmod-lib-lzo=y

          # ===== 网络加速 =====
          CONFIG_PACKAGE_kmod-nf-nathelper=y
          CONFIG_PACKAGE_kmod-nf-flow=y

          # ===== 排除不需要的 =====
          # CONFIG_PACKAGE_ppp is not set
          # CONFIG_PACKAGE_ppp-mod-pppoe is not set
          # CONFIG_PACKAGE_odhcpd-ipv6only is not set
          # CONFIG_PACKAGE_odhcp6c is not set
          PKG_EOF

          # 6.5 生成完整配置
          make defconfig

          echo ""
          echo "=== .config 中的关键配置验证 ==="
          grep -E "CONFIG_TARGET_ramips|CONFIG_TARGET_PROFILE|CONFIG_PACKAGE_luci-app-adguardhome|CONFIG_PACKAGE_adguardhome|CONFIG_PACKAGE_smartdns|CONFIG_PACKAGE_kmod-mt7603|CONFIG_PACKAGE_kmod-mt76x2" .config || true
          echo ""
          echo "=== AdGuard Home 配置检查 ==="
          grep -E "CONFIG_PACKAGE.*adguard" .config || echo "⚠ 未找到 AdGuard Home 配置项"

      # ============================================================
      # 7. 下载源码包
      # ============================================================
      - name: Download source packages
        run: |
          cd openwrt-src
          echo "=== 开始下载源码包 ==="
          make download -j$(nproc) V=s
          echo "✅ 源码包下载完成"

      # ============================================================
      # 8. 编译固件
      # ============================================================
      - name: Build firmware
        run: |
          cd openwrt-src
          echo "=== 开始编译 (线程数: $(nproc)) ==="
          make -j$(nproc) V=s || make -j1 V=s
          echo "✅ 编译完成"

          echo ""
          echo "=== 固件文件 ==="
          ls -lh bin/targets/${TARGET}/${SUBTARGET}/

      # ============================================================
      # 9. UPX 压缩大二进制（可选）
      # ============================================================
      - name: UPX compress large binaries
        run: |
          echo "=== UPX 压缩 (保守参数) ==="
          if command -v upx &> /dev/null; then
            find openwrt-src/bin/targets/ -type f \( -name "*.elf" -o -name "*.bin" \) | while read -r file; do
              SIZE=$(stat -c%s "$file" 2>/dev/null || echo 0)
              if [ "$SIZE" -gt 204800 ]; then
                echo "尝试压缩: $file ($((SIZE / 1024)) KB)"
                upx --lzma --best "$file" 2>/dev/null && echo "  ✅ 完成" || echo "  ⚠ 跳过 (非可执行文件或格式不支持)"
              fi
            done
          else
            echo "⚠ UPX 未安装，跳过"
          fi

      # ============================================================
      # 10. 检查固件大小
      # ============================================================
      - name: Check firmware size
        run: |
          echo "=== 固件文件 ==="
          ls -lh openwrt-src/bin/targets/${TARGET}/${SUBTARGET}/ 2>/dev/null
          echo ""
          echo "=== 空间检查 ==="
          FIRMWARE_SIZE=$(stat -c%s openwrt-src/bin/targets/${TARGET}/${SUBTARGET}/*sysupgrade*.bin 2>/dev/null || echo 0)
          MAX_SIZE=$((15 * 1024 * 1024))
          echo "固件大小: $((FIRMWARE_SIZE / 1024 / 1024)) MB ($FIRMWARE_SIZE bytes)"
          echo "最大限制: $((MAX_SIZE / 1024 / 1024)) MB ($MAX_SIZE bytes)"
          if [ "$FIRMWARE_SIZE" -gt "$MAX_SIZE" ]; then
            echo "❌ 固件超出 flash 空间限制!"
            exit 1
          fi
          echo "✅ 固件大小合适"

      # ============================================================
      # 11. 上传固件产物
      # ============================================================
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ env.DEVICE_NAME }}-${{ steps.version.outputs.version }}-source
          path: openwrt-src/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/*
          retention-days: 30

      # ============================================================
      # 12. 生成校验和
      # ============================================================
      - name: Generate checksums
        run: |
          cd openwrt-src/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}
          sha256sum * > sha256sums.txt
          echo "=== SHA256 校验和 ==="
          cat sha256sums.txt

      # ============================================================
      # 13. 创建 Release
      # ============================================================
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: "OpenWrt ${{ steps.version.outputs.version }} for ${{ env.DEVICE_NAME }} (Source Build)"
          body: |
            ## OpenWrt ${{ steps.version.outputs.version }} for YouHua WR1200JS
            **编译方式**: 从 OpenWrt 官方源码编译

            ### 设备信息
            - **型号**: YouHua WR1200JS
            - **SoC**: MediaTek MT7621AT (MIPS 1004Kc, 4核 880MHz)
            - **RAM**: 128MB
            - **Flash**: 16MB SPI NOR
            - **WiFi**: MT7603E (2.4G) + MT76x2E (5G)
            - **Target**: ramips/mt7621 (mipsel_24kc)

            ### 更新日志
            #### 源码编译版
            - **从源码编译**：基于 OpenWrt 官方源码构建，而非 ImageBuilder
            - **集成 AdGuard Home**：通过 feeds 方式集成 luci-app-adguardhome
            - **修复无线驱动包名错误**：将 `kmod-mt7603e` → `kmod-mt7603`，`kmod-mt76x2e` → `kmod-mt76x2`，新增 `kmod-mt76` 核心模块
            - **智能 IRQ/RPS 中断均衡**：自动检测网卡与中断，无需手动配置
            - **自动禁用 EEE**：解决 MT7621 平台网络稳定性问题
            - **线程化 NAPI**：提升高负载下网络转发性能
            - **ZRAM 内存压缩**：缓解 128MB 内存压力
            - **sysctl 网络优化**：BBR、连接跟踪、队列长度等
            - **硬件 NAT 卸载**：降低千兆转发 CPU 占用
            - **SmartDNS + dnsmasq 协同**：SmartDNS 监听 6053，dnsmasq 转发
            - **保留 Argon 主题、Wizard、UPnP、nano、wget、ethtool**
            - 不含 PPPoE、SQM、QoSmate

            ### 固件说明
            基于 OpenWrt 官方源码定制编译，精简稳定，全自动优化。
            **本固件不含 PPPoE 拨号功能，适用于二级路由（DHCP 上网）场景。**

            ### 安装方法
            1. 下载最新 Release 中的 `squashfs-sysupgrade.bin` 文件
            2. 刷入 Breed 后断电，按住 WiFi 按钮插电，访问 `192.168.1.1` 进入 Breed
            3. 恢复出厂后刷入之前下载的 bin 文件

            ### 预装软件
            | 分类 | 软件 |
            |------|------|
            | Web 管理 | LuCI + Argon 主题 + 中文 + Wizard |
            | WiFi | wpad-openssl + MT7603 + MT76x2 驱动 |
            | 网络 | 静态地址 / DHCP |
            | DNS | SmartDNS (监听 6053) + dnsmasq 转发 |
            | **AdGuard Home** | **luci-app-adguardhome + adguardhome 核心** |
            | UPnP | miniupnpd-nftables |
            | 工具 | nano, wget, ethtool |
            | 内存优化 | ZRAM 压缩 |
            | 网络加速 | 硬件 NAT 卸载 (flow offloading) |
            | 系统优化 | 智能 IRQ 均衡、线程化 NAPI、自动禁用 EEE、CPU 调度器 performance |
            | 空间优化 | UPX 二进制压缩 |

            ### 硬件支持
            ✅ 所有 10 个 LED 灯 (Power/2.4G/5G/WPS/Internet/LAN1-4/USB)
            ✅ 所有 3 个按钮 (Reset/WPS/WiFi)
            ✅ 5 个千兆网口 (4 LAN + 1 WAN)
            ✅ 双频 WiFi (2.4G b/g/n + 5G a/n/ac)
            ✅ USB 3.0 端口
            ✅ 串口 (115200/8N1)
          files: |
            openwrt-src/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/*factory*.bin
            openwrt-src/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/*sysupgrade*.bin
            openwrt-src/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/sha256sums.txt
          draft: false
          prerelease: false
